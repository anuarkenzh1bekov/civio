[project]
name = "civio-backend"
version = "0.1.0"
description = "Civio API: rule engine, intake, assistant and sessions."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "httpx>=0.27",
  "anthropic>=0.40",
  "python-dotenv>=1.0",
  "google-cloud-firestore>=2.20,<3",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
